<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>صفحه‌کلید آنلاین فارسی</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root {
    --navy: #202c3b;
    --navy-light: #344357;
    --gold: #b99a65;
    --gold-light: #d5bc91;
    --cream: #f5f1e8;
    --white: #fffefa;
    --text: #354052;
    --muted: #92918b;
    --border: #e8e0d2;
    --danger: #a65b55;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 5px;

    font-family: 'Vazirmatn', sans-serif;

    background:
        radial-gradient(circle at top right, #e9dfca, transparent 45%),
        linear-gradient(135deg, #e9e3d7, #f7f5ef);

    color: var(--text);
}



.container {
    width: 100%;
    max-width: 920px;

    background: var(--white);

    padding: 35px;

    border-radius: 18px;

    border: 1px solid var(--border);

    box-shadow:
        0 20px 60px rgba(40, 45, 50, 0.09),
        0 3px 10px rgba(40, 45, 50, 0.04);

}



.header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    width: 55px;
    height: 55px;

    margin: 0 auto 5px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--navy);

    color: var(--gold-light);

    border-radius: 14px;

    font-size: 25px;

    box-shadow: 0 5px 15px rgba(32, 44, 59, 0.15);
}

h2 {
    color: var(--navy);

    margin: 0 0 9px;

    font-size: 25px;
    font-weight: 700;
}

.description {
    color: var(--muted);
    font-size: 13px;
}



.divider {
    width: 65px;
    height: 2px;

    background: var(--gold);

    margin: 18px auto 0;
}



textarea {
    width: 100%;
    height: 155px;

    padding: 18px;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: #fcfaf5;

    color: var(--navy);

    font: 16px 'Vazirmatn', sans-serif;

    resize: vertical;

    outline: none;

    line-height: 2;

    transition: .25s;
}

textarea::placeholder {
    color: #b4b0a7;
}

textarea:focus {
    border-color: var(--gold);

    background: white;

    box-shadow: 0 0 0 4px rgba(185, 154, 101, 0.10);
}


.keyboard {
    margin-top: 25px;

    display: flex;
    flex-direction: column;

    gap: 10px;
}

.row {
    display: flex;
    justify-content: center;

    gap: 7px;
}



button {
    flex: 1;
    min-width: 0;

    height: 53px;

    border: 1px solid #e9e3d8;
    border-radius: 9px;

    background: #f5f2eb;

    color: var(--navy);

    font: 600 15px 'Vazirmatn', sans-serif;

    cursor: pointer;

    transition: all .2s ease;
}

button:hover {
    background: var(--navy);

    color: var(--gold-light);

    border-color: var(--navy);

    transform: translateY(-2px);

    box-shadow: 0 4px 10px rgba(32, 44, 59, 0.12);
}

button:active {
    transform: scale(.95);
}

/* Special Buttons */

.special {
    background: var(--navy);

    color: var(--gold-light);

    border-color: var(--navy);
}

.special:hover {
    background: var(--gold);

    color: white;

    border-color: var(--gold);
}

/* Delete */

.delete {
    background: #f8eeeb;

    color: var(--danger);

    border-color: #ead8d2;
}

.delete:hover {
    background: var(--danger);

    color: white;

    border-color: var(--danger);
}

/* Space and Enter */

.space {
    flex: 2.5;
}

.enter {
    flex: 1;
}

/* Tools */

.tools {
    display: flex;

    gap: 12px;

    margin-top: 23px;
}

.tools button {
    height: 46px;

    font-size: 13px;
}



.footer {
    text-align: center;

    margin-top: 30px;
    padding-top: 18px;

    border-top: 1px solid var(--border);

    font-size: 11px;

    color: var(--muted);

    letter-spacing: 1px;
}

.footer span {
    color: var(--gold);
}


@media(max-width: 700px) {

    body {
        padding: 12px;
    }

    .container {
        padding: 23px 12px;
    }

    h2 {
        font-size: 21px;
    }

    .row {
        gap: 4px;
    }

    button {
        height: 43px;
        font-size: 11px;
        border-radius: 7px;
    }

    textarea {
        height: 135px;
        font-size: 14px;
    }

    .tools {
        gap: 6px;
    }

    .tools button {
        font-size: 10px;
        height: 42px;
    }

}

@media(max-width: 380px) {

    .row {
        gap: 3px;
    }

    button {
        font-size: 10px;
        height: 39px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">⌨</div>

        <h2>صفحه‌کلید آنلاین فارسی</h2>



        <div class="divider"></div>

    </div>

    <textarea
        id="output"
        placeholder="متن خود را اینجا تایپ کنید..."
    ></textarea>

    <div class="keyboard">

        <div class="row">
            <button onclick="insertText('۱')">۱</button>
            <button onclick="insertText('۲')">۲</button>
            <button onclick="insertText('۳')">۳</button>
            <button onclick="insertText('۴')">۴</button>
            <button onclick="insertText('۵')">۵</button>
            <button onclick="insertText('۶')">۶</button>
            <button onclick="insertText('۷')">۷</button>
            <button onclick="insertText('۸')">۸</button>
            <button onclick="insertText('۹')">۹</button>
            <button onclick="insertText('۰')">۰</button>
            <button class="delete" onclick="backspace()">⌫</button>
        </div>

        <div class="row">
            <button onclick="insertText('ض')">ض</button>
            <button onclick="insertText('ص')">ص</button>
            <button onclick="insertText('ث')">ث</button>
            <button onclick="insertText('ق')">ق</button>
            <button onclick="insertText('ف')">ف</button>
            <button onclick="insertText('غ')">غ</button>
            <button onclick="insertText('ع')">ع</button>
            <button onclick="insertText('ه')">ه</button>
            <button onclick="insertText('خ')">خ</button>
            <button onclick="insertText('ح')">ح</button>
            <button onclick="insertText('ج')">ج</button>
            <button onclick="insertText('چ')">چ</button>
        </div>

        <div class="row">
            <button onclick="insertText('ش')">ش</button>
            <button onclick="insertText('س')">س</button>
            <button onclick="insertText('ی')">ی</button>
            <button onclick="insertText('ب')">ب</button>
            <button onclick="insertText('ل')">ل</button>
            <button onclick="insertText('ا')">ا</button>
            <button onclick="insertText('ت')">ت</button>
            <button onclick="insertText('ن')">ن</button>
            <button onclick="insertText('م')">م</button>
            <button onclick="insertText('ک')">ک</button>
            <button onclick="insertText('گ')">گ</button>
            <button onclick="insertText('و')">و</button>
        </div>

        <div class="row">
            <button onclick="insertText('ظ')">ظ</button>
            <button onclick="insertText('ط')">ط</button>
            <button onclick="insertText('ز')">ز</button>
            <button onclick="insertText('ر')">ر</button>
            <button onclick="insertText('ذ')">ذ</button>
            <button onclick="insertText('د')">د</button>
            <button onclick="insertText('پ')">پ</button>
            <button onclick="insertText('ژ')">ژ</button>
            <button onclick="insertText('.')">.</button>
            <button onclick="insertText('،')">،</button>

            <button class="space special" onclick="insertText(' ')">
                فاصله
            </button>

            <button class="enter special" onclick="insertText('\n')">
                ↵
            </button>
        </div>

    </div>

    <div class="tools">

        <button class="special" onclick="copyText()">
            کپی متن
        </button>

        <button onclick="selectText()">
            انتخاب همه
        </button>

        <button class="delete" onclick="clearText()">
            پاک کردن همه
        </button>

    </div>


</div>

<div>dsg</div>

<script>

const output = document.getElementById("output");

function insertText(value) {

    output.focus();

    const start = output.selectionStart;
    const end = output.selectionEnd;

    output.setRangeText(value, start, end, "end");

}

function backspace() {

    output.focus();

    const start = output.selectionStart;
    const end = output.selectionEnd;

    if (start !== end) {

        output.setRangeText("", start, end, "end");

    }

    else if (start > 0) {

        // حذف صحیح کاراکترهای فارسی و ایموجی
        const text = output.value;
        const before = text.slice(0, start);

        const chars = Array.from(before);
        chars.pop();

        const newBefore = chars.join("");

        output.setRangeText(
            "",
            newBefore.length,
            start,
            "end"
        );

    }

}

function clearText() {

    output.value = "";

    output.focus();

}

function selectText() {

    output.focus();

    output.select();

}

async function copyText() {

    try {

        await navigator.clipboard.writeText(output.value);

        alert("متن با موفقیت کپی شد!");

    }

    catch (error) {

        output.select();

        const success = document.execCommand("copy");

        alert(
            success
            ? "متن کپی شد!"
            : "لطفاً متن را دستی کپی کنید."
        );

    }

}

</script>

</body>
</html>
